<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>webCut</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">webCut</div>
    <div class="top-actions">
      <button id="openVideoBtn">打开视频</button>
      <button id="addImageBtn">+ 图像</button>
      <button id="addAudioBtn">+ 音频</button>
      <button id="asrBtn" class="accent">Qwen ASR</button>
      <button id="exportBtn" class="accent">导出</button>
    </div>
  </header>

  <main class="workspace">
    <section class="center-panel preview-panel">
      <div id="stage" class="preview-wrap stage">
        <div id="audioOnlyPreview" class="audio-only-preview hidden">🎵 音频工程</div>
        <div id="emptyPreview" class="empty-preview">打开一个主视频开始剪辑</div>
      </div>
      <div class="transport">
        <button id="prevFrameBtn">◀ 帧</button>
        <button id="playBtn">▶</button>
        <button id="nextFrameBtn">帧 ▶</button>
        <span id="timeText">00:00.000 / 00:00.000</span>
        <span id="mediaInfo" class="media-info">未载入</span>
        <label>FPS <input id="fpsInput" type="number" value="30" min="1" max="240" /></label>
        <button id="storyboardBtn">故事板</button>
      </div>
    </section>

    <aside class="panel inspector-panel">
      <div class="panel-title">属性 / 字幕</div>
      <div id="inspectorEmpty" class="inspector-empty">选择时间轴片段</div>
      <div id="inspectorContent" class="hidden inspector-content">
        <div class="field"><label>文件</label><div id="fileName">-</div></div>
        <div class="field"><label>所在轨道</label><div id="clipTrack">-</div></div>
        <div class="field grid2"><label>时间轴开始<input id="clipStart" type="number" step="0.01"></label><label>片段时长<input id="clipDuration" type="number" step="0.01"></label></div>
        <div class="field grid2"><label>素材入点<input id="clipIn" type="number" step="0.01"></label><label>素材出点<input id="clipOut" type="number" step="0.01"></label></div>
        <div class="field audio-only-field"><label>音量 %<input id="clipVolume" type="number" min="0" max="200" step="1"></label></div>
        <div class="field visual-only"><label>不透明度 %<input id="clipOpacity" type="number" min="0" max="100" step="1"></label></div>
      </div>
      <div class="subtitle-actions"><button id="addSubtitleBtn">+ 字幕</button><button id="exportSrtBtn">导出 SRT</button></div>
    </aside>
  </main>

  <section class="timeline-section">
    <div class="editbar">
      <button id="splitBtn">✂ 分割</button>
      <button id="deleteClipBtn">删除片段</button>
      <button id="undoBtn">撤销</button>
      <span class="divider"></span>
      <button id="addVisualTrackBtn">+ 视频/图像轨</button>
      <button id="addAudioTrackBtn">+ 音频轨</button>
      <span class="divider"></span>
      <button id="zoomOutBtn">−</button>
      <input id="zoomRange" class="zoom-range" type="range" min="20" max="240" value="90">
      <button id="zoomInBtn">＋</button>
      <button id="fitTimelineBtn">适合窗口</button>
      <span id="zoomLabel" class="zoom-label">90px/s</span>
      <span class="hint">Ctrl+滚轮缩放 · Space 播放 · S 分割 · Delete 删除 · ←/→逐帧</span>
    </div>
    <div id="timeline" class="timeline">
      <div id="timelineInner" class="timeline-inner">
        <div id="ruler" class="ruler"></div>
        <div id="tracksContainer"></div>
        <div id="playhead" class="playhead"></div>
      </div>
    </div>
  </section>

  <dialog id="storyboardDialog">
    <form method="dialog" class="dialog-box wide">
      <div class="dialog-head"><h3>帧导览 / 故事板</h3><button value="cancel">×</button></div>
      <div class="dialog-tools"><label>每 <input id="storyInterval" type="number" value="1" min="0.1" step="0.1" /> 秒一帧</label><button type="button" id="generateStoryboardBtn">生成</button></div>
      <div id="storyboardGrid" class="storyboard-grid"></div>
    </form>
  </dialog>

  <dialog id="asrDialog">
    <form method="dialog" class="dialog-box">
      <div class="dialog-head"><h3>Qwen ASR</h3><button value="cancel">×</button></div>
      <label>API 地址<input id="asrUrl" placeholder="http://127.0.0.1:8000/asr" /></label>
      <label>Bearer Token<input id="asrToken" placeholder="可留空" /></label>
      <label>文件字段名<input id="asrField" value="file" /></label>
      <div class="dialog-actions"><button type="button" id="saveAsrConfigBtn">保存配置</button><button type="button" id="runAsrBtn" class="accent">开始识别</button></div>
      <pre id="asrStatus">等待操作</pre>
    </form>
  </dialog>

  <dialog id="exportDialog">
    <form method="dialog" class="dialog-box">
      <div class="dialog-head"><h3>导出</h3><button value="cancel">×</button></div>
      <label>类型<select id="exportType"><option value="video">视频</option><option value="audio">仅音频</option></select></label>
      <label>格式<select id="exportFormat"><option value="original">保持原格式</option><option>mp4</option><option>webm</option><option>mp3</option><option>wav</option><option>flac</option><option>m4a</option></select></label>
      <div class="dialog-actions"><button type="button" id="runExportBtn" class="accent">开始导出</button></div>
      <pre id="exportStatus">等待操作</pre>
    </form>
  </dialog>

  <input id="mainVideoInput" type="file" accept="video/*,.mkv,.avi,.mov,.mp4,.webm,.m4v" hidden />
  <input id="imageInput" type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp" multiple hidden />
  <input id="audioInput" type="file" accept="audio/*,.mp3,.wav,.m4a,.flac,.aac,.opus,.ogg" multiple hidden />

  <script src="./file-protocol-guard.js" defer></script>
  <script>
    (() => {
      const NativeWorker = window.Worker;
      if(!NativeWorker || location.protocol === 'file:') return;
      window.Worker = class WebCutWorker extends NativeWorker {
        constructor(url, options){
          let target = url;
          try {
            const s = String(url);
            if(s.startsWith('blob:') && options?.type === 'module') target = new URL('./ffmpeg-worker.js', location.href).href;
          } catch {}
          super(target, options);
        }
      };
    })();
  </script>
  <script src="./app-v05.js" defer></script>
</body>
</html>
